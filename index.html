<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coder Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-container">
    <!-- Left Sidebar: Vertical Tabs -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Tabs</span>
        <button id="btn-new-tab" class="new-tab-btn" title="Open new tab (Ctrl+T)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <!-- Vertical list of open tabs -->
      <div id="tab-list" class="tab-list"></div>
    </aside>

    <!-- Main Content Area: Nav Bar + Webviews -->
    <div id="main-content">
      <!-- Top Navigation Bar (controls active tab) -->
      <nav id="nav-bar">
        <div class="nav-controls">
          <button id="btn-back" class="nav-btn" title="Back" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <button id="btn-forward" class="nav-btn" title="Forward" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <button id="btn-reload" class="nav-btn" title="Reload">
            <svg id="reload-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
        </div>

        <!-- Address Bar Form -->
        <form id="url-form">
          <div class="url-input-wrapper">
            <span class="url-security-icon" id="security-icon">🔒</span>
            <input 
              type="text" 
              id="url-input" 
              placeholder="Search or enter web address" 
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <button type="submit" id="btn-go" class="nav-btn-go">Go</button>
        </form>
      </nav>

      <!-- Webview Container (holds webview elements for tabs) -->
      <main id="webview-container"></main>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
