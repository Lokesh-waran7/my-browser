<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coder Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-container">
    <!-- Left Sidebar: Vertical Tabs -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <button id="btn-toggle-sidebar" class="sidebar-icon-btn" title="Toggle Sidebar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <span class="sidebar-title">Tabs</span>
        <button id="btn-new-tab" class="sidebar-icon-btn" title="Open new tab (Ctrl+T)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- Vertical list of open tabs -->
      <div id="tab-list" class="tab-list"></div>
    </aside>

    <!-- Main Content Area -->
    <div id="main-content">
      <!-- Top Navigation Toolbar -->
      <nav id="nav-bar">
        <div class="nav-controls">
          <button id="btn-back" class="nav-btn" title="Back" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <button id="btn-forward" class="nav-btn" title="Forward" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <button id="btn-reload" class="nav-btn" title="Reload">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
        </div>

        <!-- Address Bar Form -->
        <form id="url-form">
          <div class="url-input-wrapper">
            <span class="url-security-icon" id="security-icon">🔒</span>
            <input 
              type="text" 
              id="url-input" 
              placeholder="Search or enter web address" 
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <button type="submit" id="btn-go" class="nav-btn-go">Go</button>
        </form>

        <!-- Split View Controls -->
        <div class="split-controls">
          <button id="btn-split-toggle" class="nav-btn" title="Toggle Split View (Ctrl+Shift+S)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="12" y1="3" x2="12" y2="21"></line>
            </svg>
          </button>
          <button id="btn-swap-panes" class="nav-btn split-active-only" title="Swap Left & Right Panes">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"></path>
            </svg>
          </button>
          <button id="btn-close-split" class="nav-btn split-active-only" title="Close Split View">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </nav>

      <!-- Crash Notification Banner -->
      <div id="crash-banner" class="crash-banner hidden">
        <span>⚠️ This web page crashed unexpectedly.</span>
        <button id="btn-reload-crash" class="crash-reload-btn">Reload Page</button>
      </div>

      <!-- Main View Area (Geometry anchor for WebContentsViews) -->
      <div id="view-area">
        <!-- Single Mode Mount Area -->
        <div id="view-mount-single"></div>

        <!-- Split View Container -->
        <div id="split-container" class="hidden">
          <!-- Left Pane -->
          <div id="pane-left" class="split-pane">
            <div class="pane-header" id="header-left">
              <div class="pane-header-info">
                <span class="pane-favicon" id="favicon-left">🌐</span>
                <span class="pane-title" id="title-left">Left Pane</span>
              </div>
              <span class="pane-status-badge">Left</span>
            </div>
            <div id="view-mount-left" class="pane-view-mount"></div>
          </div>

          <!-- Draggable Split Divider -->
          <div id="split-divider" class="split-divider" title="Drag to resize panes">
            <div class="divider-grip"></div>
          </div>

          <!-- Right Pane -->
          <div id="pane-right" class="split-pane">
            <div class="pane-header" id="header-right">
              <div class="pane-header-info">
                <span class="pane-favicon" id="favicon-right">🌐</span>
                <span class="pane-title" id="title-right">Right Pane</span>
              </div>
              <span class="pane-status-badge">Right</span>
            </div>
            <div id="view-mount-right" class="pane-view-mount"></div>

            <!-- Tab Picker (Shown in right pane when selecting tab for split) -->
            <div id="tab-picker" class="tab-picker hidden">
              <div class="picker-card">
                <h3>Select a Tab for Right Pane</h3>
                <p>Choose an existing tab or open a new one:</p>
                <div id="picker-tab-list" class="picker-tab-list"></div>
                <div class="picker-actions">
                  <button id="btn-picker-new-tab" class="picker-btn primary">+ Open New Tab</button>
                  <button id="btn-picker-cancel" class="picker-btn secondary">Cancel</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
